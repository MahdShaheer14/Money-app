    // Natural-language parser for Budge Smart Log
    function parseNaturalLanguageCommand(input, categories, accounts) {
      const raw = input.trim();
      if (!raw) return null;

      const lower = raw.toLowerCase();

      // 1. Determine type (Income vs Expense)
      const isIncome =
        lower.startsWith('income') ||
        lower.startsWith('earned') ||
        lower.startsWith('received') ||
        lower.includes('salary') ||
        lower.includes('paycheck') ||
        lower.includes('freelance');

      const type = isIncome ? 'income' : 'expense';

      // 2. Extract first numeric amount
      const amountMatch = raw.match(/(\d+(?:,\d{3})*(?:\.\d{1,2})?)/);
      if (!amountMatch) return null;
      const amount = parseFloat(amountMatch[1].replace(/,/g, ''));
      if (isNaN(amount) || amount <= 0) return null;

      // 3. Match Account if specified
      let matchedAccount = accounts[0];
      for (const acc of accounts) {
        const accNameLower = acc.name.toLowerCase();
        if (
          lower.includes(accNameLower) ||
          (accNameLower.includes('checking') && lower.includes('checking')) ||
          (accNameLower.includes('savings') && lower.includes('savings')) ||
          (accNameLower.includes('credit') && (lower.includes('credit') || lower.includes('card'))) ||
          (accNameLower.includes('cash') && lower.includes('cash'))
        ) {
          matchedAccount = acc;
          break;
        }
      }

      // 4. Match Category if Expense
      let matchedCategory = categories[0];
      if (!isIncome) {
        let foundCat = null;
        // Check explicit category name first
        for (const cat of categories) {
          const catSimple = cat.name.toLowerCase().split('&')[0].trim();
          if (lower.includes(cat.name.toLowerCase()) || lower.includes(catSimple)) {
            foundCat = cat;
            break;
          }
        }
        // Check keywords if not matched by name
        if (!foundCat) {
          for (const cat of categories) {
            if (cat.keywords && cat.keywords.some((kw) => lower.includes(kw.toLowerCase()))) {
              foundCat = cat;
              break;
            }
          }
        }
        if (foundCat) matchedCategory = foundCat;
      }

      // 5. Clean title extraction
      let cleanedTitle = raw
        .replace(amountMatch[0], '')
        .replace(/^(add|spent|spend|log|paid|pay|income|earned|received|bought)\b/i, '')
        .replace(/\b(to|in|on|from|at|into|for)\s+(food\s*&\s*dining|food|housing\s*&\s*rent|housing|transport|shopping|bills\s*&\s*utilities|bills|entertainment|health\s*&\s*fitness|health|main checking|checking|high-yield savings|savings|budge rewards card|credit card|cash wallet|cash)\b/gi, '')
        .replace(/\b(to|in|on|from|for)\s*$/i, '')
        .replace(/\s+/g, ' ')
        .trim();

      if (!cleanedTitle || cleanedTitle.length < 2) {
        cleanedTitle = isIncome ? 'Quick Income Deposit' : `${matchedCategory.name} Purchase`;
      } else {
        cleanedTitle = cleanedTitle.charAt(0).toUpperCase() + cleanedTitle.slice(1);
      }

      return {
        title: cleanedTitle,
        amount,
        type,
        categoryId: isIncome ? 'income' : matchedCategory.id,
        categoryName: isIncome ? 'Income' : matchedCategory.name,
        categoryColor: isIncome ? '#10b981' : matchedCategory.color,
        accountId: matchedAccount.id,
        accountName: matchedAccount.name,
        date: '2026-10-21'
      };
    }

      const currency = CURRENCIES[currencyCode] || CURRENCIES.USD;
      const formatMoney = (amountInUSD, showDecimals = true) => {
        const converted = amountInUSD * currency.rate;
        const absVal = Math.abs(converted);
        const formatted = absVal.toLocaleString('en-US', {
          minimumFractionDigits: showDecimals && currencyCode !== 'PKR' ? 2 : 0,
          maximumFractionDigits: showDecimals && currencyCode !== 'PKR' ? 2 : 0
        });
        return `${converted < 0 ? '-' : ''}${currency.symbol}${formatted}`;
      };

      // ==========================================
      // COMPUTED FINANCIAL METRICS

      // Compute live balance for each account
      const accountsWithBalances = useMemo(() => {
        return accounts.map((acc) => {

          transactions.forEach((tx) => {
            const amt = Number(tx.amount) || 0;
            if (tx.type === 'income' && tx.accountId === acc.id) {
              balance += amt;
            } else if (tx.type === 'expense' && tx.accountId === acc.id) {
              balance -= amt;
            } else if (tx.type === 'transfer') {
              if (tx.accountId === acc.id) balance -= amt;
              if (tx.toAccountId === acc.id) balance += amt;
            }
          });
          return { ...acc, currentBalance: balance };
        });
      }, [accounts, transactions]);

      const totalNetWorth = useMemo(() => {

      // Monthly totals for October 2026

        const remainingBudget = totalBudgetLimit - expense;
        const daysLeftInMonth = 10; // Oct 21 -> Oct 31 = 10 days remaining
        const safeDailySpend = Math.max(0, remainingBudget / daysLeftInMonth);
        const savingsRate = income > 0 ? Math.max(0, Math.round(((income - expense) / income) * 100)) : 0;

        return {
          income,
          expense,
          totalBudgetLimit,
          remainingBudget,
          daysLeftInMonth,
          safeDailySpend,
          savingsRate,
          categorySpend
        };

      const calendarDays = useMemo(() => {

            empty: false,
            day,
            dateStr,
            dayTxs,
            dayIncome,
            dayExpense,
            hasRecurring,
            isToday: dateStr === '2026-10-21'

                      <ResponsiveContainer width="100%" height="100%">
                        <AreaChart data={cumulativeSpendTrend}>
                          <CartesianGrid
                            strokeDasharray="3 3"
                            stroke={darkMode ? '#1e293b' : '#e2e8f0'}
                            vertical={false}
                          />
                          <XAxis dataKey="day" stroke={darkMode ? '#94a3b8' : '#64748b'} fontSize={11} />
                          <YAxis stroke={darkMode ? '#94a3b8' : '#64748b'} fontSize={11} />
                          <RechartsTooltip
                            formatter={(value) => `${currency.symbol}${value.toLocaleString()}`}
                            contentStyle={{
                              backgroundColor: darkMode ? '#0f172a' : '#ffffff',
                              borderColor: '#6366f1',
                              borderRadius: '12px',
                              fontSize: '12px'
                            }}
                          />
                          <Area
                            type="monotone"
                            dataKey="idealPace"
                            name="Ideal Budget Pace"
                            stroke="#94a3b8"
                            strokeDasharray="5 5"
                            fill="transparent"
                          />
                          <Area
                            type="monotone"
                            dataKey="spent"
                            name="Actual Cumulative Spend"
                            stroke="#8b5cf6"
                            fill="#8b5cf6"
                            fillOpacity={0.2}
                          />
                        </AreaChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                  {/* Smart "Savings Opportunities" AI Cards */}
                  <div>
                    <h2 className="text-lg font-bold mb-3 flex items-center gap-2">
                      <Sparkles className="w-5 h-5 text-indigo-400" />
                      <span>Budge AI Savings Opportunities</span>
                    </h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className={`p-5 rounded-3xl border ${cardBg}`}>
                        <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-400">
                          Strong Cashflow Surplus
                        </span>
                        <h3 className="font-bold text-base mt-3">
                          {monthlyStats.savingsRate}% Net Savings Rate
                        </h3>
                        <p className={`text-xs mt-1.5 leading-relaxed ${textMuted}`}>
                          You've retained {formatMoney(Math.max(0, monthlyStats.income - monthlyStats.expense))} this month. Moving {formatMoney(500)} into High-Yield Savings (4.8% APY) will accelerate your Kyoto Trip goal to 100% before November!
                        </p>
                      </div>

                      <div className={`p-5 rounded-3xl border ${cardBg}`}>
                        <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-400">
                          Category Watch
                        </span>
                        <h3 className="font-bold text-base mt-3">
                          Shopping & Dining Pace
                        </h3>
                        <p className={`text-xs mt-1.5 leading-relaxed ${textMuted}`}>
                          Food & Dining is currently at {formatMoney(monthlyStats.categorySpend['cat-food'] || 0)}. Keeping dining under {formatMoney(18)}/day for the next 10 days will keep you comfortably below your {formatMoney(650)} cap.
                        </p>
                      </div>

                      <div className={`p-5 rounded-3xl border ${cardBg}`}>
                        <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-indigo-500/15 text-indigo-400">
                          Recurring Audit
                        </span>
                        <h3 className="font-bold text-base mt-3">
                          {transactions.filter((t) => t.recurring && t.type === 'expense').length} Active Subscriptions
                        </h3>
                        <p className={`text-xs mt-1.5 leading-relaxed ${textMuted}`}>
                          Your fixed recurring expenses total{' '}
                          {formatMoney(
                            transactions
                              .filter((t) => t.recurring && t.type === 'expense')
                              .reduce((s, t) => s + Number(t.amount), 0)
                          )}{' '}
                          this month. All October utility & streaming bills have been paid on time.
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* ========================================== */}
          {/* MOBILE FIXED BOTTOM NAVIGATION BAR */}
          {/* ========================================== */}
          <nav
            className={`lg:hidden fixed bottom-0 left-0 right-0 z-40 border-t px-2 py-2 flex items-center justify-around backdrop-blur-lg ${
              darkMode
                ? 'bg-slate-900/95 border-slate-800'
                : 'bg-white/95 border-slate-200'
            }`}
          >
            {navItems.map((item) => {
              const Icon = item.icon;
              const active = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center gap-1 px-3 py-1.5 rounded-xl text-[11px] font-semibold transition-all ${
                    active ? 'text-indigo-500' : textMuted
                  }`}
                >
                  <Icon className="w-5 h-5" />
                  <span className="truncate max-w-[68px]">{item.label.split(' ')[0]}</span>
                </button>
              );
            })}
          </nav>

          {/* ========================================== */}
          {/* MODAL 1: "+ ADD TRANSACTION" FULL MODAL */}
          {/* ========================================== */}
          {isTxModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4">
              <div
                className={`w-full max-w-md rounded-3xl border p-6 shadow-2xl ${
                  darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
                }`}
              >
                <div className="flex items-center justify-between mb-5">
                  <h3 className="text-lg font-extrabold">Add Transaction</h3>
                  <button
                    onClick={() => setIsTxModalOpen(false)}
                    className={`p-1.5 rounded-xl ${subCardBg}`}
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleAddTransactionSubmit} className="space-y-4">
                  {/* Type Selector */}
                  <div className="grid grid-cols-3 gap-2 p-1 rounded-2xl border bg-slate-800/30 border-slate-700/40">
                    {['expense', 'income', 'transfer'].map((t) => (
                      <button
                        key={t}
                        type="button"
                        onClick={() => setTxForm({ ...txForm, type: t })}
                        className={`py-2 rounded-xl text-xs font-bold capitalize transition-all ${
                          txForm.type === t
                            ? t === 'income'
                              ? 'bg-emerald-600 text-white'
                              : t === 'transfer'
                              ? 'bg-indigo-600 text-white'
                              : 'bg-rose-600 text-white'
                            : textMuted
                        }`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>

                  {/* Amount & Date */}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Amount (USD Base)
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        required
                        value={txForm.amount}
                        onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })}
                        placeholder="0.00"
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm font-bold ${inputBg}`}
                      />
                    </div>
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Date
                      </label>
                      <input
                        type="date"
                        value={txForm.date}
                        onChange={(e) => setTxForm({ ...txForm, date: e.target.value })}
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                      />
                    </div>
                  </div>

                  {/* Title */}
                  <div>
                    <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                      Title / Merchant
                    </label>
                    <input
                      type="text"
                      required
                      value={txForm.title}
                      onChange={(e) => setTxForm({ ...txForm, title: e.target.value })}
                      placeholder="e.g., Blue Bottle Coffee, Monthly Rent..."
                      className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                    />
                  </div>

                  {/* Category (If Expense) */}
                  {txForm.type === 'expense' && (
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Budget Category
                      </label>
                      <select
                        value={txForm.categoryId}
                        onChange={(e) => setTxForm({ ...txForm, categoryId: e.target.value })}
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                      >
                        {categories.map((cat) => (
                          <option key={cat.id} value={cat.id}>
                            {cat.name}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}

                  {/* Account Selection */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        {txForm.type === 'transfer' ? 'From Account' : 'Account'}
                      </label>
                      <select
                        value={txForm.accountId}
                        onChange={(e) => setTxForm({ ...txForm, accountId: e.target.value })}
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                      >
                        {accounts.map((acc) => (
                          <option key={acc.id} value={acc.id}>
                            {acc.name}
                          </option>
                        ))}
                      </select>
                    </div>

                    {txForm.type === 'transfer' && (
                      <div>
                        <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                          To Account
                        </label>
                        <select
                          value={txForm.toAccountId}
                          onChange={(e) => setTxForm({ ...txForm, toAccountId: e.target.value })}
                          className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                        >
                          {accounts.map((acc) => (
                            <option key={acc.id} value={acc.id}>
                              {acc.name}
                            </option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>

                  {/* Recurring Checkbox */}
                  <label className="flex items-center gap-2.5 cursor-pointer pt-1">
                    <input
                      type="checkbox"
                      checked={txForm.recurring}
                      onChange={(e) => setTxForm({ ...txForm, recurring: e.target.checked })}
                      className="w-4 h-4 rounded accent-indigo-600"
                    />
                    <span className="text-xs font-semibold">
                      Mark as Recurring Monthly Bill / Subscription
                    </span>
                  </label>

                  <div className="flex items-center justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setIsTxModalOpen(false)}
                      className={`px-4 py-2.5 rounded-xl text-xs font-bold ${subCardBg}`}
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/25 cursor-pointer"
                    >
                      Save Transaction
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* MODAL 2: ADD / EDIT ACCOUNT MODAL */}
          {/* ========================================== */}
          {isAccountModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4">
              <div
                className={`w-full max-w-md rounded-3xl border p-6 shadow-2xl ${
                  darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
                }`}
              >
                <div className="flex items-center justify-between mb-5">
                  <h3 className="text-lg font-extrabold">
                    {editingAccount ? 'Edit Account' : 'Add New Account'}
                  </h3>
                  <button
                    onClick={() => setIsAccountModalOpen(false)}
                    className={`p-1.5 rounded-xl ${subCardBg}`}
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleSaveAccount} className="space-y-4">
                  <div>
                    <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                      Account Name
                    </label>
                    <input
                      type="text"
                      required
                      value={accountForm.name}
                      onChange={(e) => setAccountForm({ ...accountForm, name: e.target.value })}
                      placeholder="e.g., Chase Sapphire, Emergency Vault"
                      className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Account Type
                      </label>
                      <select
                        value={accountForm.type}
                        onChange={(e) => setAccountForm({ ...accountForm, type: e.target.value })}
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                      >
                        <option>Bank Account</option>
                        <option>Savings (4.8% APY)</option>
                        <option>Credit Card</option>
                        <option>Physical Cash</option>
                        <option>Investment</option>
                      </select>
                    </div>
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Starting Balance (USD)
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        required
                        value={accountForm.initialBalance}
                        onChange={(e) =>
                          setAccountForm({ ...accountForm, initialBalance: e.target.value })
                        }
                        placeholder="1000"
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm font-bold ${inputBg}`}
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setIsAccountModalOpen(false)}
                      className={`px-4 py-2.5 rounded-xl text-xs font-bold ${subCardBg}`}
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer"
                    >
                      {editingAccount ? 'Update Account' : 'Create Account'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* MODAL 3: NEW CUSTOM CATEGORY MODAL */}
          {/* ========================================== */}
          {isCategoryModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4">
              <div
                className={`w-full max-w-md rounded-3xl border p-6 shadow-2xl ${
                  darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
                }`}
              >
                <div className="flex items-center justify-between mb-5">
                  <h3 className="text-lg font-extrabold">Create Custom Category</h3>
                  <button
                    onClick={() => setIsCategoryModalOpen(false)}
                    className={`p-1.5 rounded-xl ${subCardBg}`}
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleAddCategory} className="space-y-4">
                  <div>
                    <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                      Category Name
                    </label>
                    <input
                      type="text"
                      required
                      value={newCategoryForm.name}
                      onChange={(e) =>
                        setNewCategoryForm({ ...newCategoryForm, name: e.target.value })
                      }
                      placeholder="e.g., Pets & Vet, Self-Care, Travel"
                      className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Monthly Budget Limit (USD)
                      </label>
                      <input
                        type="number"
                        required
                        value={newCategoryForm.limit}
                        onChange={(e) =>
                          setNewCategoryForm({ ...newCategoryForm, limit: e.target.value })
                        }
                        placeholder="250"
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm font-bold ${inputBg}`}
                      />
                    </div>
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Badge Color
                      </label>
                      <input
                        type="color"
                        value={newCategoryForm.color}
                        onChange={(e) =>
                          setNewCategoryForm({ ...newCategoryForm, color: e.target.value })
                        }
                        className="w-full h-10 rounded-xl cursor-pointer bg-transparent"
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setIsCategoryModalOpen(false)}
                      className={`px-4 py-2.5 rounded-xl text-xs font-bold ${subCardBg}`}
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer"
                    >
                      Create Category
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* MODAL 4: CREATE WISHLIST / SAVINGS GOAL */}
          {/* ========================================== */}
          {isGoalModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4">
              <div
                className={`w-full max-w-md rounded-3xl border p-6 shadow-2xl ${
                  darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
                }`}
              >
                <div className="flex items-center justify-between mb-5">
                  <h3 className="text-lg font-extrabold">New Wishlist / Savings Goal</h3>
                  <button
                    onClick={() => setIsGoalModalOpen(false)}
                    className={`p-1.5 rounded-xl ${subCardBg}`}
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCreateGoal} className="space-y-4">
                  <div>
                    <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                      Goal or Wishlist Item Title
                    </label>
                    <input
                      type="text"
                      required
                      value={goalForm.name}
                      onChange={(e) => setGoalForm({ ...goalForm, name: e.target.value })}
                      placeholder="e.g., European Summer Trip, New OLED Monitor"
                      className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Target Amount (USD)
                      </label>
                      <input
                        type="number"
                        required
                        value={goalForm.targetAmount}
                        onChange={(e) =>
                          setGoalForm({ ...goalForm, targetAmount: e.target.value })
                        }
                        placeholder="2000"
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm font-bold ${inputBg}`}
                      />
                    </div>
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Already Saved (USD)
                      </label>
                      <input
                        type="number"
                        value={goalForm.savedAmount}
                        onChange={(e) =>
                          setGoalForm({ ...goalForm, savedAmount: e.target.value })
                        }
                        placeholder="250"
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Priority
                      </label>
                      <select
                        value={goalForm.priority}
                        onChange={(e) => setGoalForm({ ...goalForm, priority: e.target.value })}
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                      >
                        <option>High</option>
                        <option>Medium</option>
                        <option>Dream</option>
                      </select>
                    </div>
                    <div>
                      <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                        Target Date
                      </label>
                      <input
                        type="date"
                        value={goalForm.deadline}
                        onChange={(e) => setGoalForm({ ...goalForm, deadline: e.target.value })}
                        className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${inputBg}`}
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setIsGoalModalOpen(false)}
                      className={`px-4 py-2.5 rounded-xl text-xs font-bold ${subCardBg}`}
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer"
                    >
                      Create Goal
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* MODAL 5: "+ ADD FUNDS" TO GOAL MODAL */}
          {/* ========================================== */}
          {fundGoalModal && (
            <div className="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4">
              <div
                className={`w-full max-w-sm rounded-3xl border p-6 shadow-2xl ${
                  darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
                }`}
              >
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-extrabold">
                    Fund "{fundGoalModal.name}"
                  </h3>
                  <button
                    onClick={() => setFundGoalModal(null)}
                    className={`p-1.5 rounded-xl ${subCardBg}`}
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleAddFundsToGoal} className="space-y-4">
                  <div>
                    <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                      Contribution Amount (USD)
                    </label>
                    <input
                      type="number"
                      step="1"
                      required
                      value={fundAmount}
                      onChange={(e) => setFundAmount(e.target.value)}
                      className={`w-full px-3.5 py-2.5 rounded-xl border text-base font-extrabold ${inputBg}`}
                    />
                  </div>

                  <div>
                    <label className={`block text-xs font-semibold mb-1 ${textMuted}`}>
                      Transfer From Account
                    </label>
                    <select
                      value={fundSourceAccount}
                      onChange={(e) => setFundSourceAccount(e.target.value)}
                      className={`w-full px-3.5 py-2.5 rounded-xl border text-xs ${inputBg}`}
                    >
                      <option value="acc-checking">Main Checking</option>
                      <option value="acc-cash">Cash Wallet</option>
                      <option value="none">Direct Progress Update Only</option>
                    </select>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setFundGoalModal(null)}
                      className={`px-4 py-2 rounded-xl text-xs font-bold ${subCardBg}`}
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold cursor-pointer"
                    >
                      Confirm Contribution
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
