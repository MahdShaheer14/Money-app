    const f = state.categoryForm;
    if (state.modal !== 'category' || !f) return '';
    const swatches = PALETTE.map((c) =>
      '<button type="button" class="swatch' + (f.color === c ? ' on' : '') + '" data-action="pick-color" data-target="categoryForm.color" data-value="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>').join('');
    const icons = ICON_KEYS.map((k) =>
      '<button type="button" class="icon-pick' + (f.icon === k ? ' on' : '') + '" data-action="pick-icon" data-target="categoryForm.icon" data-value="' + k + '" title="' + k + '">' + icon(iconFor(k), 'ic-sm') + '</button>').join('');
    const keywords = Array.isArray(f.keywords) ? f.keywords.join(', ') : (f.keywords || '');

    const body = '<div class="form-grid">'
      + '<div class="field full"><label>Category name</label><input class="input" id="catf-name" data-model="categoryForm.name" value="' + esc(f.name) + '" placeholder="e.g. Subscriptions" /></div>'
      + '<div class="field"><label>Monthly limit</label><div style="position:relative">' + symbolPrefix()
      + '<input class="input" style="padding-left:24px" data-model="categoryForm.limit" inputmode="decimal" value="' + esc(f.limit) + '" placeholder="0.00" /></div></div>'
      + '<div class="field"><label>Icon</label><select data-model="categoryForm.icon">'
      + ICON_KEYS.map((k) => '<option value="' + k + '"' + (f.icon === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></div>'
      + '<div class="field full"><label>Colour</label><div class="swatch-row">' + swatches + '</div></div>'
      + '<div class="field full"><label>Smart Log keywords</label>'
      + '<input class="input" data-model="categoryForm.keywords" value="' + esc(keywords) + '" placeholder="comma separated, e.g. netflix, spotify" />'
      + '<span class="tiny muted">Used to auto-detect the category when you type a transaction.</span></div>'
      + '</div>';

    const foot = (f.id ? '<button class="btn btn-danger" type="button" data-action="ask-delete-category" data-id="' + f.id + '">' + icon('trash', 'ic-sm') + 'Delete</button>' : '')
      + '<button class="btn" type="button" data-action="close-modal">Cancel</button>'
      + '<button class="btn btn-primary" type="button" data-action="save-category">' + icon('check', 'ic-sm') + 'Save category</button>';

    return modalShell(f.id ? 'Edit category' : 'New category', 'Limits are monthly, per category', body, foot);
  }

  function renderGoalModal() {
    const f = state.goalForm;
    if (state.modal !== 'goal' || !f) return '';
    const swatches = PALETTE.map((c) =>
      '<button type="button" class="swatch' + (f.color === c ? ' on' : '') + '" data-action="pick-color" data-target="goalForm.color" data-value="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>').join('');
    const icons = ICON_KEYS.map((k) =>
      '<button type="button" class="icon-pick' + (f.icon === k ? ' on' : '') + '" data-action="pick-icon" data-target="goalForm.icon" data-value="' + k + '" title="' + k + '">' + icon(iconFor(k), 'ic-sm') + '</button>').join('');

    const body = '<div class="form-grid">'
      + '<div class="field full"><label>Goal name</label><input class="input" id="goalf-name" data-model="goalForm.name" value="' + esc(f.name) + '" placeholder="e.g. Japan trip" /></div>'
      + '<div class="field"><label>Target amount</label><div style="position:relative">' + symbolPrefix()
      + '<input class="input" style="padding-left:24px" data-model="goalForm.targetAmount" inputmode="decimal" value="' + esc(f.targetAmount) + '" placeholder="0.00" /></div></div>'
      + '<div class="field"><label>Already saved</label><div style="position:relative">' + symbolPrefix()
      + '<input class="input" style="padding-left:24px" data-model="goalForm.savedAmount" inputmode="decimal" value="' + esc(f.savedAmount) + '" placeholder="0.00" /></div></div>'
      + '<div class="field"><label>Deadline</label><input class="input" type="date" data-model="goalForm.deadline" value="' + esc(f.deadline) + '" /></div>'
      + '<div class="field"><label>Priority</label><select data-model="goalForm.priority">'
      + PRIORITIES.map((p) => '<option value="' + p + '"' + (f.priority === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></div>'
      + '<div class="field full"><label>Bucket</label><input class="input" data-model="goalForm.category" value="' + esc(f.category) + '" placeholder="e.g. Travel Wishlist" /></div>'
      + '<div class="field full"><label>Colour</label><div class="swatch-row">' + swatches + '</div></div>'
      + '<div class="field full"><label>Icon</label><div class="icon-grid">' + icons + '</div></div>'
      + '</div>';

    const foot = '<button class="btn" type="button" data-action="close-modal">Cancel</button>'
      + '<button class="btn btn-primary" type="button" data-action="save-goal">' + icon('check', 'ic-sm') + 'Save goal</button>';

    return modalShell('New savings goal', 'Give every rupee a job', body, foot);
  }

  function renderFundModal() {
    const f = state.fundForm;
    if (state.modal !== 'fund' || !f) return '';
    const g = goalById(f.goalId);
    if (!g) return '';
    const pct = clamp(Math.round((g.savedAmount / Math.max(1, g.targetAmount)) * 100), 0, 100);
    const remaining = Math.max(0, g.targetAmount - g.savedAmount);
    const accOptions = state.accounts.map((a) =>
      '<option value="' + a.id + '"' + (f.accountId === a.id ? ' selected' : '') + '>' + esc(a.name) + ' \u00b7 ' + esc(money(accountBalance(a, state.transactions))) + '</option>').join('');

    const body = '<div style="display:flex;gap:11px;align-items:center">'
      + '<span class="tx-icon" style="width:42px;height:42px;background:var(--panel-2);background:color-mix(in srgb,' + g.color + ' 18%,transparent);color:' + g.color + '">' + icon(iconFor(g.icon), 'ic-lg') + '</span>'
      + '<div style="min-width:0"><div style="font-weight:750">' + esc(g.name) + '</div>'
      + '<div class="tiny muted">' + esc(money(g.savedAmount)) + ' of ' + esc(money(g.targetAmount)) + ' \u00b7 ' + esc(money(remaining)) + ' to go</div></div></div>'
      + '<div class="bar tall"><i style="width:' + pct + '%;background:' + g.color + '"></i></div>'
      + '<div class="form-grid">'
      + '<div class="field"><label>Amount to add</label><div style="position:relative">' + symbolPrefix()
      + '<input class="input" style="padding-left:24px" id="fund-amount" data-model="fundForm.amount" inputmode="decimal" value="' + esc(f.amount) + '" placeholder="0.00" /></div></div>'
      + '<div class="field"><label>Take it from</label><select data-model="fundForm.accountId">' + accOptions + '</select></div>'
      + '</div>'
      + '<div class="preview">' + icon('info', 'ic-sm') + '<span>This logs a transfer into your savings account so balances stay honest.</span></div>';

    const foot = '<button class="btn" type="button" data-action="close-modal">Cancel</button>'
      + '<button class="btn btn-primary" type="button" data-action="save-fund">' + icon('plus', 'ic-sm') + 'Add to goal</button>';

    return modalShell('Fund this goal', 'Move money toward the thing you want', body, foot);
  }

  function renderConfirmModal() {
    const c = state.confirm;
    if (!c) return '';
    const body = '<div style="display:flex;gap:11px;align-items:flex-start">'
      + '<span class="pill bad" style="flex:none">' + icon('alert', 'ic-sm') + '</span>'
      + '<div style="font-size:13px;line-height:1.6">' + esc(c.message) + '</div></div>';
    const foot = '<button class="btn" type="button" data-action="close-modal">Keep it</button>'
      + '<button class="btn btn-danger" type="button" data-action="confirm-yes">' + esc(c.confirmLabel || 'Delete') + '</button>';
    return modalShell(c.title || 'Are you sure?', '', body, foot);
  }

  function renderModals() {
    return renderTxModal() + renderAccountModal() + renderCategoryModal()
      + renderGoalModal() + renderFundModal() + renderConfirmModal();
  }

  function renderToast() {
    if (!state.toast) return '';
    const t = state.toast;
    return '<div class="toast-wrap"><div class="toast ' + (t.type || '') + '">'
      + icon(t.type === 'err' ? 'alert' : t.type === 'info' ? 'info' : 'checkCircle', 'ic-sm')
      + '<span>' + esc(t.text) + '</span></div></div>';
  }

  /* =====================================================================
     19. RENDER — root dispatcher
     ===================================================================== */
  function renderTabBody() {
    switch (state.tab) {
      case 'transactions': return renderTransactionsTab();
      case 'budgets': return renderBudgetsTab();
      case 'goals': return renderGoalsTab();
      case 'accounts': return renderAccountsTab();
      case 'insights': return renderInsightsTab();
      case 'settings': return renderSettingsTab();
      default: return renderDashboard();
    }
  }

  function render() {
    const active = document.activeElement;
    const activeId = active && active.id ? active.id : null;
    const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

    const app = document.getElementById('app');
    app.innerHTML = '<div class="shell">'
      + renderSidebar()
      + '<main class="main">'
      + renderTopbar()
      + '<div class="content">' + renderTabBody() + '</div>'
      + '<footer class="foot">Budge \u00b7 a single-file finance dashboard \u00b7 data stays in your browser</footer>'
      + '</main></div>'
      + renderModals()
      + renderToast();

    document.body.setAttribute('data-theme', state.theme);
    document.body.style.overflow = state.modal || state.confirm ? 'hidden' : '';

    if (activeId) {
      const next = document.getElementById(activeId);
      if (next) {
        next.focus();
        if (caret !== null && next.setSelectionRange) {
          try { next.setSelectionRange(caret, caret); } catch (err) { /* not a text input */ }
        }
      }
    }
  }

  let toastTimer = null;
  function toast(text, type) {
    state.toast = { text: text, type: type || 'ok' };
    render();
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      state.toast = null;
      render();
    }, 3400);
  }

  function ask(title, message, confirmLabel, onYes) {
    state.confirm = { title: title, message: message, confirmLabel: confirmLabel, onYes: onYes };
    render();
  }

  /* =====================================================================
     20. ACTIONS
     ===================================================================== */
  function openTxModal(tx) {
    const base = {
      id: tx ? tx.id : null,
      type: tx ? tx.type : 'expense',
      title: tx ? tx.title : '',
      amount: tx ? String(tx.amount) : '',
      categoryId: tx ? (tx.categoryId === 'income' ? (state.categories[0] || {}).id : tx.categoryId) : (state.categories[0] || {}).id,
      accountId: tx ? tx.accountId : (state.accounts[0] || {}).id,
      toAccountId: tx && tx.toAccountId ? tx.toAccountId : (state.accounts[1] || state.accounts[0] || {}).id,
      date: tx ? tx.date : defaultEntryDate(),
      recurring: tx ? !!tx.recurring : false,
      notes: tx ? (tx.notes || '') : ''
    };
    state.txForm = base;
    state.modal = 'tx';
    render();
    const el = document.getElementById('txf-title');
    if (el) setTimeout(() => el.focus(), 30);
  }

  function saveTx() {
    const f = state.txForm;
    if (!f) return;
    const amount = num(String(f.amount).replace(/,/g, ''));
    if (!f.title.trim()) { toast('Give the transaction a name first.', 'err'); return; }
    if (!(amount > 0)) { toast('Enter an amount greater than zero.', 'err'); return; }
    if (f.type === 'transfer' && f.accountId === f.toAccountId) { toast('Pick two different accounts for a transfer.', 'err'); return; }

    const payload = {
      title: f.title.trim(),
      amount: amount,
      type: f.type,
      categoryId: f.type === 'income' ? 'income' : (f.type === 'transfer' ? 'transfer' : f.categoryId),
      accountId: f.accountId,
      date: f.date || defaultEntryDate(),
      recurring: !!f.recurring,
      notes: (f.notes || '').trim()
    };
    if (f.type === 'transfer') payload.toAccountId = f.toAccountId;

    if (f.id) {
      const idx = state.transactions.findIndex((t) => t.id === f.id);
      if (idx >= 0) state.transactions[idx] = Object.assign({}, state.transactions[idx], payload);
      toast('Transaction updated.');
    } else {
      payload.id = uid('tx');
      state.transactions.push(payload);
      toast(payload.type === 'transfer' ? 'Transfer logged.' : 'Transaction added.');
    }

    state.viewMonth = (payload.date || '').slice(0, 7) || state.viewMonth;
    state.selectedDate = payload.date;
    state.txForm = null;
    state.modal = null;
    persist();
    render();
  }

  function deleteTx(id) {
    state.transactions = state.transactions.filter((t) => t.id !== id);
    persist();
    state.confirm = null;
    toast('Transaction deleted.');
  }

  function openAccountModal(acc) {
    state.accountForm = acc
      ? Object.assign({}, acc, { initialBalance: String(acc.initialBalance) })
      : { id: null, name: '', type: 'Bank Account', initialBalance: '', color: PALETTE[0], icon: 'Landmark', number: '\u2022\u2022\u2022\u2022 1024' };
    state.modal = 'account';
    render();
    const el = document.getElementById('accf-name');
    if (el) setTimeout(() => el.focus(), 30);
  }

  function saveAccount() {
    const f = state.accountForm;
    if (!f) return;
    if (!f.name.trim()) { toast('Your account needs a name.', 'err'); return; }
    const payload = {
      name: f.name.trim(),
      type: f.type,
      initialBalance: num(String(f.initialBalance).replace(/,/g, '')),
      color: f.color,
      icon: f.icon,
      number: (f.number || '').trim() || '\u2022\u2022\u2022\u2022 ' + Math.floor(1000 + Math.random() * 9000)
    };
    if (f.id) {
      const idx = state.accounts.findIndex((a) => a.id === f.id);
      if (idx >= 0) state.accounts[idx] = Object.assign({}, state.accounts[idx], payload);
      toast('Account updated.');
    } else {
      payload.id = uid('acc');
      state.accounts.push(payload);
      toast('Account created.');
    }
    state.accountForm = null;
    state.modal = null;
    persist();
    render();
  }

  function deleteAccount(id) {
    if (state.accounts.length <= 1) { toast('Keep at least one account.', 'err'); state.confirm = null; render(); return; }
    state.transactions = state.transactions.filter((t) => t.accountId !== id && t.toAccountId !== id);
    state.accounts = state.accounts.filter((a) => a.id !== id);
    persist();
    state.confirm = null;
    toast('Account and its transactions removed.');
  }

  function openCategoryModal(cat) {
    state.categoryForm = cat
      ? Object.assign({}, cat, { limit: String(cat.limit), keywords: (cat.keywords || []).join(', ') })
      : { id: null, name: '', limit: '', color: PALETTE[1], icon: 'Sparkles', keywords: '' };
    state.modal = 'category';
    render();
    const el = document.getElementById('catf-name');
    if (el) setTimeout(() => el.focus(), 30);
  }

  function saveCategory() {
    const f = state.categoryForm;
    if (!f) return;
    if (!f.name.trim()) { toast('Name the category first.', 'err'); return; }
    const limit = num(String(f.limit).replace(/,/g, ''));
    const keywords = String(f.keywords || '').split(',').map((k) => k.trim().toLowerCase()).filter(Boolean);
    const payload = { name: f.name.trim(), limit: limit, color: f.color, icon: f.icon, keywords: keywords };
    if (f.id) {
      const idx = state.categories.findIndex((c) => c.id === f.id);
      if (idx >= 0) state.categories[idx] = Object.assign({}, state.categories[idx], payload);
      toast('Category updated.');
    } else {
      payload.id = uid('cat');
      state.categories.push(payload);
      toast('Category created.');
    }
    state.categoryForm = null;
    state.modal = null;
    persist();
    render();
  }

  function deleteCategory(id) {
    state.transactions.forEach((t) => { if (t.categoryId === id) t.categoryId = ''; });
    state.categories = state.categories.filter((c) => c.id !== id);
    persist();
    state.confirm = null;
    state.categoryForm = null;
    state.modal = null;
    toast('Category deleted. Its transactions are now uncategorised.');
  }

  function openGoalModal() {
    state.goalForm = {
      name: '', targetAmount: '', savedAmount: '', category: 'Wishlist', priority: 'High',
      deadline: shiftMonth(todayStr().slice(0, 7), 6) + '-01', color: PALETTE[0], icon: 'Target'
    };
    state.modal = 'goal';
    render();
    const el = document.getElementById('goalf-name');
    if (el) setTimeout(() => el.focus(), 30);
  }

  function saveGoal() {
    const f = state.goalForm;
    if (!f) return;
    const target = num(String(f.targetAmount).replace(/,/g, ''));
    if (!f.name.trim()) { toast('Give the goal a name.', 'err'); return; }
    if (!(target > 0)) { toast('Set a target amount above zero.', 'err'); return; }
    state.goals.push({
      id: uid('goal'),
      name: f.name.trim(),
      targetAmount: target,
      savedAmount: Math.max(0, num(String(f.savedAmount).replace(/,/g, ''))),
      category: (f.category || 'Wishlist').trim(),
      priority: f.priority,
      deadline: f.deadline,
      color: f.color,
      icon: f.icon
    });
    state.goalForm = null;
    state.modal = null;
    persist();
    toast('Goal created.');
  }

  function deleteGoal(id) {
    state.goals = state.goals.filter((g) => g.id !== id);
    persist();
    state.confirm = null;
    toast('Goal removed.');
  }

  function openFundModal(id) {
    const g = goalById(id);
    if (!g) return;
    state.fundForm = { goalId: id, amount: '150', accountId: (state.accounts[0] || {}).id };
    state.modal = 'fund';
    render();
    const el = document.getElementById('fund-amount');
    if (el) setTimeout(() => { el.focus(); el.select(); }, 30);
  }

  function saveFund() {
    const f = state.fundForm;
    if (!f) return;
    const goal = goalById(f.goalId);
    if (!goal) return;
    const amount = num(String(f.amount).replace(/,/g, ''));
    if (!(amount > 0)) { toast('Enter an amount to move.', 'err'); return; }

    const source = accById(f.accountId);
    if (!source) { toast('Pick a source account.', 'err'); return; }
    const savings = state.accounts.find((a) => /saving/i.test(a.name) || /saving/i.test(a.type)) || source;

    goal.savedAmount = num(goal.savedAmount) + amount;

    if (savings.id !== source.id) {
      state.transactions.push({
        id: uid('tx'),
        title: 'Goal funding \u2014 ' + goal.name,
        amount: amount,
        type: 'transfer',
        categoryId: 'transfer',
        accountId: source.id,
        toAccountId: savings.id,
        date: defaultEntryDate(),
        recurring: false,
        notes: 'Moved into goal: ' + goal.name
      });
    }
    state.fundForm = null;
    state.modal = null;
    persist();
    toast(money(amount) + ' added to ' + goal.name + '.');
  }

  function exportJson() {
    const payload = {
      app: 'Budge', version: 1, exportedAt: new Date().toISOString(),
      accounts: state.accounts, categories: state.categories,
      transactions: state.transactions, goals: state.goals,
      prefs: { theme: state.theme, currency: state.currency }
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'budge-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('Backup downloaded.', 'info');
  }

  function importJson(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || !Array.isArray(data.transactions) || !Array.isArray(data.accounts)) {
          toast('That file does not look like a Budge backup.', 'err');
          return;
        }
        state.accounts = data.accounts;
        state.categories = Array.isArray(data.categories) && data.categories.length ? data.categories : state.categories;
        state.transactions = data.transactions;
        state.goals = Array.isArray(data.goals) ? data.goals : state.goals;
        if (data.prefs && CURRENCIES[data.prefs.currency]) state.currency = data.prefs.currency;
        if (data.prefs && data.prefs.theme) state.theme = data.prefs.theme;
        persist();
        render();
        toast('Backup restored.');
      } catch (err) {
        toast('Could not read that JSON file.', 'err');
      }
    };
    reader.readAsText(file);
  }

  function resetData() {
    state.accounts = clone(SEED_ACCOUNTS);
    state.categories = clone(SEED_CATEGORIES);
    state.transactions = clone(SEED_TRANSACTIONS);
    state.goals = clone(SEED_GOALS);
    state.viewMonth = '2026-10';
    state.selectedDate = '2026-10-21';
    state.filters = { search: '', type: 'all', account: 'all' };
    state.confirm = null;
    persist();
    render();
    toast('Demo data restored.', 'info');
  }

  /* =====================================================================
     21. EVENT WIRING
     ===================================================================== */
  function handleAction(action, el) {
    switch (action) {
      case 'tab':
        state.tab = el.getAttribute('data-tab') || 'dashboard';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
        break;

      case 'toggle-theme':
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        persist();
        render();
        break;

      case 'month-prev':
        state.viewMonth = shiftMonth(state.viewMonth, -1);
        state.selectedDate = state.viewMonth + '-01';
        render();
        break;

      case 'month-next':
        state.viewMonth = shiftMonth(state.viewMonth, 1);
        state.selectedDate = state.viewMonth + '-01';
        render();
        break;

      case 'select-day':
        state.selectedDate = el.getAttribute('data-date');
        render();
        break;

      case 'smart-submit': submitSmart(); break;

      case 'open-tx': openTxModal(null); break;
      case 'edit-tx': openTxModal(state.transactions.find((t) => t.id === el.getAttribute('data-id')) || null); break;
      case 'save-tx': saveTx(); break;
      case 'ask-delete-tx': {
        const id = el.getAttribute('data-id');
        const tx = state.transactions.find((t) => t.id === id);
        ask('Delete transaction?', 'This removes "' + (tx ? tx.title : 'this entry') + '" from your ledger and recalculates balances.', 'Delete', function () { deleteTx(id); });
        break;
      }
      case 'tx-type':
        state.txForm.type = el.getAttribute('data-type');
        render();
        break;

      case 'open-account': openAccountModal(null); break;
      case 'edit-account': openAccountModal(state.accounts.find((a) => a.id === el.getAttribute('data-id')) || null); break;
      case 'save-account': saveAccount(); break;
      case 'ask-delete-account': {
        const id = el.getAttribute('data-id');
        const acc = accById(id);
        ask('Delete account?', 'This also deletes every transaction linked to "' + (acc ? acc.name : 'this account') + '".', 'Delete account', function () { deleteAccount(id); });
        break;
      }

      case 'open-category': openCategoryModal(null); break;
      case 'edit-limit': openCategoryModal(state.categories.find((c) => c.id === el.getAttribute('data-id')) || null); break;
      case 'save-category': saveCategory(); break;
      case 'ask-delete-category': {
        const id = el.getAttribute('data-id');
        const cat = catById(id);
        ask('Delete category?', 'Transactions in "' + (cat ? cat.name : 'this category') + '" will be kept but become uncategorised.', 'Delete', function () { deleteCategory(id); });
        break;
      }

      case 'open-goal': openGoalModal(); break;
      case 'save-goal': saveGoal(); break;
      case 'ask-delete-goal': {
        const id = el.getAttribute('data-id');
        const g = goalById(id);
        ask('Delete goal?', '"' + (g ? g.name : 'This goal') + '" will be removed. Money already moved stays in your accounts.', 'Delete goal', function () { deleteGoal(id); });
        break;
      }
      case 'open-fund': openFundModal(el.getAttribute('data-id')); break;
      case 'save-fund': saveFund(); break;

      case 'pick-color':
        setPath(state, el.getAttribute('data-target'), el.getAttribute('data-value'));
        render();
        break;
      case 'pick-icon':
        setPath(state, el.getAttribute('data-target'), el.getAttribute('data-value'));
        render();
        break;

      case 'smart-example':
        state.smartInput = el.getAttribute('data-text') || '';
        render();
        break;

      case 'clear-filters':
        state.filters = { search: '', type: 'all', account: 'all' };
        render();
        break;

      case 'open-import':
        {
          const input = document.getElementById('import-file');
          if (input) input.click();
        }
        break;
      case 'import-json':
        {
          const input = document.getElementById('import-file');
          if (input) input.click();
        }
        break;
      case 'export-json': exportJson(); break;
      case 'ask-reset':
        ask('Reset everything?', 'All your edits are replaced with the original demo dataset. Export a backup first if you want to keep them.', 'Reset data', resetData);
        break;

      case 'close-modal':
        state.modal = null;
        state.confirm = null;
        state.txForm = null;
        state.accountForm = null;
        state.categoryForm = null;
        state.goalForm = null;
        state.fundForm = null;
        render();
        break;

      case 'confirm-yes':
        if (state.confirm && typeof state.confirm.onYes === 'function') state.confirm.onYes();
        break;

      default: break;
    }
  }

  document.addEventListener('click', function (event) {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.getAttribute('data-action');
    if (action === 'backdrop') {
      if (event.target === target) {
        state.modal = null;
        state.confirm = null;
        state.txForm = null;
        state.accountForm = null;
        state.categoryForm = null;
        state.goalForm = null;
        state.fundForm = null;
        render();
      }
      return;
    }
    event.preventDefault();
    handleAction(action, target);
  });

  document.addEventListener('input', function (event) {
    const el = event.target;
    if (!el || !el.getAttribute) return;
    const model = el.getAttribute('data-model');
    if (!model) return;
    if (el.type === 'checkbox') setPath(state, model, el.checked);
    else setPath(state, model, el.value);

    if (model === 'smartInput') {
      // Only refresh the preview region, so typing stays perfectly smooth.
      const host = document.querySelector('.preview');
      const fresh = renderSmartPreview();
      if (host && fresh) host.outerHTML = fresh;
      else if (host && !fresh) host.remove();
      else if (!host && fresh) {
        const form = document.querySelector('.smart-form');
        if (form) form.insertAdjacentHTML('afterend', fresh);
      }
      return;
    }
    if (model.indexOf('filters.') === 0) { render(); return; }
    if (model === 'fundForm.amount' || model === 'fundForm.accountId') return;
    if (model.indexOf('goalForm.') === 0 || model.indexOf('accountForm.') === 0
      || model.indexOf('categoryForm.') === 0 || model.indexOf('txForm.') === 0) return;
  });

  document.addEventListener('change', function (event) {
    const el = event.target;
    if (!el || !el.getAttribute) return;

    if (el.id === 'import-file') {
      importJson(el.files && el.files[0]);
      el.value = '';
      return;
    }

    const model = el.getAttribute('data-model');
    if (!model) return;

    if (el.type === 'checkbox') setPath(state, model, el.checked);
    else setPath(state, model, el.value);

    if (model === 'currency') {
      persist();
      render();
      return;
    }
    if (model === 'txForm.type' || model === 'filters.type' || model === 'filters.account') { render(); return; }
    if (model === 'fundForm.accountId') return;
    if (model.indexOf('Form.') !== -1) return;
    render();
  });

  function submitSmart() {
    const raw = state.smartInput.trim();
    if (!raw) { toast('Type something like "18.50 matcha" first.', 'info'); return; }
    const parsed = parseSmartInput(raw);
    if (!parsed) { toast('Could not read that. Try "Add 12.50 lunch in Food".', 'err'); return; }
    if (parsed.error) { toast(parsed.error, 'err'); return; }
    if (!parsed.accountId) { toast('Add an account before using Smart Log.', 'err'); return; }

    state.transactions.push({
      id: uid('tx'),
      title: parsed.title,
      amount: parsed.amount,
      type: parsed.type,
      categoryId: parsed.categoryId || 'uncategorised',
      accountId: parsed.accountId,
      date: parsed.date,
      recurring: false,
      notes: 'Added with Smart Log'
    });
    state.smartInput = '';
    state.viewMonth = parsed.date.slice(0, 7);
    state.selectedDate = parsed.date;
    persist();
    render();
    toast(parsed.title + ' \u00b7 ' + money(parsed.amount) + ' logged.');
  }

  document.addEventListener('submit', function (event) {
    const form = event.target.closest ? event.target.closest('[data-action="smart-submit"]') : null;
    if (!form) return;
    event.preventDefault();
    submitSmart();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      const open = state.modal || state.confirm;
      if (open) {
        state.modal = null;
        state.confirm = null;
        state.txForm = null;
        state.accountForm = null;
        state.categoryForm = null;
        state.goalForm = null;
        state.fundForm = null;
        render();
      }
    }
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
      if (state.modal === 'tx') saveTx();
      else if (state.modal === 'account') saveAccount();
      else if (state.modal === 'category') saveCategory();
      else if (state.modal === 'goal') saveGoal();
    }
    if (event.key === 'n' && !event.metaKey && !event.ctrlKey && !state.modal) {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
        event.preventDefault();
        openTxModal(null);
      }
    }
  });

  /* =====================================================================
     22. BOOT
     ===================================================================== */
  document.body.setAttribute('data-theme', state.theme);
  render();
})();
</script>
